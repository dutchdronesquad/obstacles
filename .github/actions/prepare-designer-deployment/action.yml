name: Prepare designer deployment
description: Install locked Wrangler tooling without lifecycle scripts and restore the checked designer site.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.21.0
        cache: npm
    - name: Install deployment tooling
      shell: bash
      run: npm ci --ignore-scripts
    - name: Download checked designer
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: designer-site
        path: designer/app/dist/
