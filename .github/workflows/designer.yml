name: Designer

on:
  push:
    branches: [main]
    paths:
      - "designer/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/designer.yml"
      - ".github/ISSUE_TEMPLATE/submit-collection.yml"
  pull_request:
    paths:
      - "designer/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/designer.yml"
      - ".github/ISSUE_TEMPLATE/submit-collection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: designer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No environment or secrets while building and testing artwork or application code.
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run designer:test
      - run: npx wrangler deploy --config designer/app/wrangler.jsonc --dry-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: designer-site
          path: designer/app/dist/
          if-no-files-found: error

  production:
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: designer-production
      url: https://designer.trackdraw.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: designer-site
          path: designer/app/dist/
      - name: Deploy checked site
        run: npx wrangler deploy --config designer/app/wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify HTTPS
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 10 https://designer.trackdraw.app/ --output /dev/null

  preview:
    needs: build-and-test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: designer-preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: designer-site
          path: designer/app/dist/
      - name: Upload version without changing production
        id: upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          npx wrangler versions upload --config designer/app/wrangler.jsonc --preview-alias "pr-$PR_NUMBER" 2>&1 | tee "$RUNNER_TEMP/designer-upload.log"
          preview_url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/designer-upload.log" | tail -1)
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "[Open designer preview]($preview_url) for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify preview HTTPS
        env:
          SITE_URL: ${{ steps.upload.outputs.url }}
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 10 "$SITE_URL" --output /dev/null
