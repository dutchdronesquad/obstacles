name: Designer

on:
  push:
    branches: [main]
    paths:
      - "designer/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/designer*.yml"
      - ".github/actions/prepare-designer-deployment/**"
      - ".github/ISSUE_TEMPLATE/submit-collection.yml"
  pull_request:
    paths:
      - "designer/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/designer*.yml"
      - ".github/actions/prepare-designer-deployment/**"
      - ".github/ISSUE_TEMPLATE/submit-collection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: designer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Checks
    uses: ./.github/workflows/designer-build.yml

  preview:
    name: Preview
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: designer-preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare designer deployment
        uses: ./.github/actions/prepare-designer-deployment
      - name: Upload version without changing production
        id: upload
        env:
          DESIGNER_VERSION: ${{ needs.build.outputs.version }}
          DESIGNER_COMMIT: ${{ needs.build.outputs.commit }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          npx wrangler versions upload --config designer/app/wrangler.jsonc --preview-alias "pr-$PR_NUMBER" --tag "$DESIGNER_VERSION" --message "commit $DESIGNER_COMMIT" 2>&1 | tee "$RUNNER_TEMP/designer-upload.log"
          preview_url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/designer-upload.log" | tail -1)
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "[Open designer preview]($preview_url) for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify preview version over HTTPS
        env:
          SITE_URL: ${{ steps.upload.outputs.url }}
          DESIGNER_VERSION: ${{ needs.build.outputs.version }}
          DESIGNER_COMMIT: ${{ needs.build.outputs.commit }}
        run: node scripts/verify-designer.mjs
