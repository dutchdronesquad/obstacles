name: Build designer

on:
  workflow_call:
    outputs:
      version:
        description: Designer build version
        value: ${{ jobs.build.outputs.version }}
      commit:
        description: Full checked-out commit SHA
        value: ${{ jobs.build.outputs.commit }}

permissions:
  contents: read

jobs:
  # No environment or secrets while building and testing artwork or application code.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Resolve designer version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/designer-version.mjs >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Validate types and run unit tests
        run: npm run typecheck && npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build designer and run browser tests
        env:
          VITE_DESIGNER_VERSION: ${{ steps.version.outputs.version }}
          VITE_DESIGNER_COMMIT: ${{ steps.version.outputs.commit }}
        run: npm run designer:test
      - name: Validate deployment package
        run: npx wrangler deploy --config designer/app/wrangler.jsonc --dry-run
      - name: Upload checked designer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: designer-site
          path: designer/app/dist/
          if-no-files-found: error
