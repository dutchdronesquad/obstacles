name: Publish assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-assets
  cancel-in-progress: false

jobs:
  # Renders template sheets and checks everything without access to secrets.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install, test and build
        run: npm ci && npm run assets:check && npm test && npm run textures:build
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: public-assets
          path: build/
          if-no-files-found: error
  # Only uploads the checked bytes; never renders submitted artwork while secrets are present.
  upload:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: public-assets
          path: public-assets
      - name: Publish
        run: node scripts/upload-assets.mjs --from public-assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  verify:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: public-assets
          path: public-assets
      - name: Verify
        run: node scripts/verify-assets.mjs --from public-assets
