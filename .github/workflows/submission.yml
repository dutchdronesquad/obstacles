name: Submission
# A maintainer adds the accepted-submission label to a "Submit obstacle artwork" issue.
on:
  issues:
    types: [labeled]
permissions: {}
concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  # Downloads and renders the submitted SVGs without write access.
  prepare:
    name: Prepare
    if: github.event.label.name == 'accepted-submission'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache and no token here: this job processes untrusted files.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: npm ci
      - name: Prepare collection
        run: node scripts/submission.mjs prepare submission
      - name: Upload prepared files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: submission
          path: submission/
          include-hidden-files: false
  # Never renders or executes submitted content: writes the prepared files after path checks and opens the pull request.
  open:
    name: Open PR
    needs: prepare
    # Also runs when prepare crashed, so the issue always hears what happened.
    if: always() && github.event.label.name == 'accepted-submission'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Download prepared files
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: submission
          path: submission
      - name: Open pull request or report problems
        id: open
        run: node scripts/submission.mjs open submission
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The dispatched check run cannot trigger the preview-comment workflow, so this job posts the previews.
      - name: Post previews on the pull request
        if: steps.open.outputs.sha != ''
        timeout-minutes: 25
        run: node scripts/submission.mjs preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ steps.open.outputs.branch }}
          HEAD_SHA: ${{ steps.open.outputs.sha }}
          SINCE: ${{ steps.open.outputs.since }}
