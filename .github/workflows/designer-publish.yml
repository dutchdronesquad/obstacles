name: Publish designer

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: designer-production
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/designer-build.yml

  production:
    name: Deploy Production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: designer-production
      url: https://designer.trackdraw.app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare designer deployment
        uses: ./.github/actions/prepare-designer-deployment
      - name: Deploy checked designer
        run: npx wrangler deploy --config designer/app/wrangler.jsonc --tag "$DESIGNER_VERSION" --message "commit $DESIGNER_COMMIT"
        env:
          DESIGNER_VERSION: ${{ needs.build.outputs.version }}
          DESIGNER_COMMIT: ${{ needs.build.outputs.commit }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify production version over HTTPS
        env:
          SITE_URL: https://designer.trackdraw.app
          DESIGNER_VERSION: ${{ needs.build.outputs.version }}
          DESIGNER_COMMIT: ${{ needs.build.outputs.commit }}
        run: node scripts/verify-designer.mjs
