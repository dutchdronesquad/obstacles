name: Preview cleanup
# Never checks out pull request code; only removes that pull request's images from the previews branch.
on:
  pull_request_target:
    types: [closed]
permissions: {}
concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number }}
jobs:
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Remove previews
        run: node scripts/preview-comment.mjs remove ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
