name: Preview cleanup
# Never checks out pull request code; only removes that pull request's images from the previews branch.
on:
  pull_request_target:
    types: [closed]
permissions: {}
concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number }}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Remove previews
        run: node scripts/preview-comment.mjs remove ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
