name: Check assets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Test committed assets
        run: npm run assets:check && npm test
      # Render contact sheets for reviewers even when checks fail.
      - name: Render review contact sheets
        if: always() && steps.install.outcome == 'success'
        run: npm run textures:preview
      - name: Upload contact sheets
        if: always() && steps.install.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: texture-previews
          path: previews/
          if-no-files-found: ignore
      - name: Regenerate textures
        run: npm run assets:multigp:refresh
      - name: Test regenerated assets
        run: npm run assets:check && npm test
