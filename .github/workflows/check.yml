name: Check assets
on:
  push:
  pull_request:
  # Used by the submission workflow, whose pull requests do not trigger pull_request runs.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Test committed assets
        run: |
          set -o pipefail
          mkdir -p previews
          npm run -s assets:check 2>&1 | tee previews/check-output.txt
          npm run typecheck
          npm test
      # Preview the collections this branch changes, also when checks fail.
      - name: Find changed collections
        id: changed
        if: always() && steps.install.outcome == 'success' && github.event_name != 'push'
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          ids=$(git diff --name-only "$BASE"...HEAD -- collections | cut -d/ -f2 | grep -E '^[a-z0-9]+(-[a-z0-9]+)*$' | sort -u | while read -r id; do [ -f "collections/$id/manifest.json" ] && echo "$id"; done | tr '\n' ' ')
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - name: Render contact sheets and 3D views
        if: always() && steps.changed.outputs.ids != ''
        env:
          IDS: ${{ steps.changed.outputs.ids }}
        run: |
          npx playwright install --with-deps chromium
          # IDS holds validated slugs only; word splitting is intended.
          npm run -s textures:preview -- --3d $IDS
      - name: Upload previews
        if: always() && steps.install.outcome == 'success' && github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: texture-previews
          path: previews/
          if-no-files-found: ignore
      - name: Regenerate MultiGP textures
        run: npm run assets:multigp:refresh
      - name: Test regenerated assets
        run: npm run assets:check && npm test
