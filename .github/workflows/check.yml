name: Check assets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test committed assets
        run: npm test
      - name: Regenerate MultiGP textures
        run: npm run assets:multigp:refresh
      - name: Test regenerated assets
        run: npm test
