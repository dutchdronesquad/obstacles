name: Submit club artwork
description: Send your finished template sheets; after review, a bot turns them into a pull request with previews.
title: "collection: <club name>"
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing artwork! Design each texture set on a copy of a [template sheet](https://github.com/dutchdronesquad/obstacles/blob/main/templates/README.md) (`gate-standard-v1.svg` for the standard 5x5 gate, `corner-flag-v1.svg` for the corner flag) and attach the saved `.svg` files below. No git or other tools are needed.

        After a maintainer accepts the submission, a pull request with 3D previews is opened automatically and linked here.
  - type: input
    id: organization
    attributes:
      label: Club or organization
      description: The collection name shown in TrackDraw.
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Collection slug
      description: Lowercase letters, digits and hyphens, for example `dds`. It becomes part of the public URLs.
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website
      description: Club website or social profile (optional).
  - type: input
    id: author
    attributes:
      label: Artwork author
      description: Who made the artwork, for example the club or a designer.
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: Attribution
      description: Credits and rights holder, for example "Club logo and artwork by Example Club".
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: Usage terms
      description: How others may use this artwork. Example — "Artwork and logo remain the property of Example Club. Provided to represent Example Club obstacles in TrackDraw; no other use is granted."
    validations:
      required: true
  - type: dropdown
    id: portable
    attributes:
      label: Offline exports
      description: May TrackDraw include this artwork in portable or offline exports of tracks?
      options:
        - "No"
        - "Yes, our usage terms allow it"
    validations:
      required: true
  - type: textarea
    id: artwork
    attributes:
      label: Template sheets
      description: Drag your `.svg` files here, one per texture set. Optionally give each a name with `data-name` (see the template guide).
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything reviewers should know (optional).
  - type: checkboxes
    id: permission
    attributes:
      label: Permission
      options:
        - label: I own this artwork or have permission from the rights holder to publish it here under the terms above.
          required: true
        - label: The artwork does not copy MultiGP or other third-party branding without permission.
          required: true
