name: Submit obstacle artwork
description: Send your finished template sheets; after review, a bot turns them into a pull request with previews.
title: "collection: <organization name>"
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Design each texture set on a copy of a [template sheet](https://github.com/dutchdronesquad/track-assets/blob/main/templates/README.md) and attach the saved `.svg` files below. After review, a pull request with 3D previews is opened automatically and linked here.
  - type: input
    id: organization
    attributes:
      label: Organization
      description: Your club, chapter, league, team or brand, as shown in TrackDraw.
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Short name
      description: Optional. Used in web addresses, for example `dds`. Leave empty to derive it from the organization name.
  - type: textarea
    id: artwork
    attributes:
      label: Template sheets
      description: Drag your `.svg` files here, one per texture set.
    validations:
      required: true
  - type: dropdown
    id: usage
    attributes:
      label: Usage
      description: Where may this artwork be used? It stays your property either way.
      options:
        - In TrackDraw only
        - In TrackDraw, including offline track exports
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional, for example your website, or a designer to credit.
  - type: checkboxes
    id: permission
    attributes:
      label: Permission
      options:
        - label: We own this artwork or have permission to publish it, and it does not copy MultiGP or other third-party branding.
          required: true
